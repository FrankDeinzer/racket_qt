<!doctype html>
<!-- Prototype of the exam page (HACKING §85.16): ONE window, two artificial "tabs" -- the Racket/Qt-WASM app and the submission
     platform (here a plain textarea). Both stay loaded (display switch only), so Racket keeps running while the other tab is shown.
     Served with COOP/COEP (the Racket module needs SharedArrayBuffer), see serve-and-run.mjs. -->
<html><head><meta charset="utf-8"><title>exam-host</title>
<style>
  body{margin:0;font:14px sans-serif}
  #bar{height:28px;background:#ddd;display:flex;gap:4px;padding:2px}
  #bar button{padding:2px 12px}
  #racket,#submit{position:absolute;top:32px;left:0;right:0;bottom:0}
  #racket{border:0;width:100%;height:calc(100% - 32px)}
  /* The Racket frame is never hidden (display:none would also stop its rendering); the submission pane is opaque and lies on top of it.
     Keyboard focus after switching back is restored inside the frame by main.cpp (Qt's focus helper lives in a shadow root, HACKING §85.16). */
  #diag{position:fixed;right:0;bottom:0;width:46%;height:40%;z-index:20;background:#ffffe0;border:1px solid #888;font:11px monospace;overflow:auto;white-space:pre-wrap;padding:2px}
  #diagbar{position:fixed;right:0;bottom:40%;z-index:21;background:#eee}
  #submit{z-index:10;background:#fff}
  #doc{position:absolute;top:32px;left:0;right:0;bottom:0;z-index:10;background:#fff;border:0;width:100%;height:calc(100% - 32px)}
  #submit textarea{width:100%;height:100%;box-sizing:border-box;font:14px monospace}
  .hidden{display:none}
</style></head><body>
<div id="bar"><button id="t1" onclick="show('racket')">Racket</button><button id="t2" onclick="show('submit')">Abgabe</button><button id="t3" onclick="show('doc')">Doku</button></div>
<iframe id="racket" tabindex="0" src="racketqt_wasm.html" allow="cross-origin-isolated; clipboard-read; clipboard-write"></iframe>
<iframe id="doc" class="hidden" src="about:blank"></iframe>
<div id="submit" class="hidden"><textarea id="ta" placeholder="Abgabe"></textarea></div>
<script>
  // ?qtdebug (and any other query) is handed on to the Racket frame; with ?qtdebug the Qt layer logs key/mouse events to the browser console.
  document.getElementById('racket').src = 'racketqt_wasm.html' + location.search;
  function focusRacket(){ const f = document.getElementById('racket'); f.focus(); try { f.contentWindow.focus(); } catch(e) {} }
  window.addEventListener('load', () => setTimeout(focusRacket, 500));
  function show(w){
    if (w === 'racket') setTimeout(focusRacket, 50);
    document.getElementById('submit').classList.toggle('hidden', w !== 'submit');
    document.getElementById('doc').classList.toggle('hidden', w !== 'doc');
    if (w === 'submit') document.getElementById('ta').focus();
  }
  // Documentation (HACKING §85.20): racket's send-url (F1, Help Desk, "Help" links) arrives here as {rqtOpenUrl: 'doc/reference/...'}; the docs are static
  // files under <server>/doc/ (tools/stage-docs.sh).  Anything else is not opened (the exam browser blocks the network anyway).
  window.addEventListener('message', e => {
    const u = e.data && e.data.rqtOpenUrl;
    if (typeof u !== 'string') return;
    if (!/^doc\//.test(u)) { console.warn('exam-host: URL nicht geoeffnet:', u); return; }
    document.getElementById('doc').src = u;
    show('doc');
  });
  window.__bench = {};
  const ta = document.getElementById('ta');
  ta.addEventListener('input', () => { window.__bench = { text: ta.value }; });
  ta.addEventListener('paste', e => { window.__bench = { pasteEvent: (e.clipboardData && e.clipboardData.getData('text/plain')) || null, text: ta.value }; });
  window.addEventListener('beforeunload', e => { e.preventDefault(); e.returnValue = ''; });   // a reload would lose the MEMFS

  // ?clipdiag: on-screen log of clipboard events (copy/cut/paste/Cmd+C) in this page and in the Racket frame, plus two write tests.
  if (new URLSearchParams(location.search).has('clipdiag')) {
    const d = document.createElement('div'); d.id = 'diag'; document.body.appendChild(d);
    const b = document.createElement('div'); b.id = 'diagbar'; document.body.appendChild(b);
    const log = m => { d.textContent += new Date().toISOString().slice(11,23) + ' ' + m + '\n'; d.scrollTop = d.scrollHeight; try { fetch('/__log', { method: 'POST', body: new Date().toISOString().slice(11,23) + ' ' + m, keepalive: true }).catch(() => {}); } catch (e) {} };
    const hook = (w, name) => {
      ['copy','cut','paste'].forEach(t => w.addEventListener(t, e => log(name + ' ' + t + ' event, clipboardData=' + (e.clipboardData ? 'yes' : 'no') + (t === 'paste' && e.clipboardData ? ' text=' + JSON.stringify(e.clipboardData.getData('text/plain').slice(0,40)) : '')), true));
      w.addEventListener('keydown', e => { if ((e.metaKey || e.ctrlKey) && /^[cvx]$/i.test(e.key)) log(name + ' keydown ' + (e.metaKey ? 'Cmd+' : 'Ctrl+') + e.key); }, true);
    };
    hook(window, 'top');
    const f = document.getElementById('racket');
    const tryHook = () => { try { if (!f.contentWindow.__diag) { f.contentWindow.__diag = 1; hook(f.contentWindow, 'frame'); } } catch (e) { log('frame hook failed: ' + e); } };
    setInterval(tryHook, 1000);
    const btn = (label, fn) => { const x = document.createElement('button'); x.textContent = label; x.onclick = fn; b.appendChild(x); };
    btn('writeText TEST-A', () => navigator.clipboard.writeText('TEST-A').then(() => log('writeText A ok'), e => log('writeText A FAIL ' + e)));
    btn('execCommand TEST-B', () => { const t = document.createElement('textarea'); t.value = 'TEST-B'; document.body.appendChild(t); t.select(); log('execCommand B -> ' + document.execCommand('copy')); t.remove(); });
    btn('clear', () => { d.textContent = ''; });
    log('clipdiag aktiv; isolated=' + self.crossOriginIsolated + ' secure=' + isSecureContext + ' UA=' + navigator.userAgent);
  }
</script></body></html>
